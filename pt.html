<style>
/* Layout: una columna tipo teléfono (390 x 844) centrada; en móvil ocupa toda la pantalla. */
:root{
  --bg:#f8f4ee; --stage:#ece5da; --ink:#212020; --ink-soft:#4a4542; --ink-mute:#6e6762;
  --water:#4c9bb3; --line:#c0b4a2; --line-soft:#ded5c7; --panel:#fdfbf9; --accent:#8a6a45;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
:root{--gap:84px}
@media (display-mode: standalone){:root{--gap:0px}}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--sans);display:grid;place-items:start center;overflow:hidden}
.app{width:100%;max-width:430px;height:calc(100% - var(--gap));max-height:900px;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:560px) and (min-height:720px){
  body{place-items:center}
  .app{height:min(100%,844px);border-radius:30px;border:1px solid #ded5c7;box-shadow:0 30px 80px rgba(90,76,58,.18)}
}
.s[data-screen="00"]{width:390px;height:844px;box-sizing:border-box;padding:36px 24px 32px;background:#f8f4ee;display:flex;flex-direction:column;font-family:"Cormorant Garamond",serif;font-weight:500;color:#212020}
.s[data-screen="00"] .w{margin:0 0 24px;font-size:14px;letter-spacing:.3em;text-transform:uppercase}
.s[data-screen="00"] .b{margin-top:auto;align-self:center;width:210px;height:48px;border:1px solid #212020;border-radius:24px;background:transparent;color:#212020;font-family:inherit;font-weight:500;font-size:18px;cursor:pointer}
.s[data-screen="00"] a.b{display:flex;align-items:center;justify-content:center;box-sizing:border-box;text-decoration:none}
.s[data-screen="00"] .t{margin:0 0 12px;font-weight:500;font-size:28px;line-height:34px}
.s[data-screen="00"] .p{margin:0;font-size:18px;line-height:25px;color:#4a4542;text-align:center}
.s[data-screen="00"] .o{min-height:48px;border:1px solid #c0b4a2;border-radius:14px;background:transparent;color:#212020;font-family:inherit;font-weight:500;font-size:18px;cursor:pointer}
.s[data-screen="00"] .o[aria-pressed=true]{background:#ece3d6;border-color:#8a6a45}
.s[data-screen="00"] .f{box-sizing:border-box;padding:10px 16px 6px;border:1px solid #c0b4a2;border-radius:14px;display:flex;flex-direction:column}
.s[data-screen="00"] .f label{font-size:18px}
.s[data-screen="00"] .f input{border:none;border-bottom:1px solid #c0b4a2;background:transparent;color:#212020;font-family:inherit;font-weight:500;font-size:17px;padding:6px 0}
.s[data-screen="00"] input::placeholder{color:#6e6762}
.s[data-screen="00"] .wf{stroke-dasharray:100 100;animation:wf-00 6s ease-in-out infinite}
@keyframes wf-00{0%{stroke-dashoffset:100}55%{stroke-dashoffset:0}80%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
@media (prefers-reduced-motion:reduce){.s[data-screen="00"] .wf{animation:none;stroke-dashoffset:0}}
.s[data-screen="00"] .w{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5;margin:0 0 6px}
.s[data-screen="00"] .ix{position:relative}
.s[data-screen="00"] .ix>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;padding-left:12px;font-family:"Open Sans",sans-serif;font-size:12px;font-weight:500;letter-spacing:.03em;text-transform:none;color:#212020}
.s[data-screen="00"] .ix>summary::-webkit-details-marker{display:none}
.s[data-screen="00"] .ix>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid #212020;border-bottom:1.5px solid #212020;transform:rotate(45deg);margin-top:-3px}
.s[data-screen="00"] .mn{position:absolute;right:0;top:100%;width:230px;box-sizing:border-box;padding:6px 14px;background:#fdfbf9;border:1px solid #ded5c7;border-radius:14px;font-family:"Open Sans",sans-serif;font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;z-index:20}
.s[data-screen="00"] .mn details>summary,.s[data-screen="00"] .mn .gr{list-style:none;cursor:pointer;min-height:42px;display:flex;align-items:center;color:#212020}
.s[data-screen="00"] .mn details>summary::-webkit-details-marker{display:none}
.s[data-screen="00"] .mn ul{margin:0 0 6px;padding:0 0 0 14px;list-style:none}
.s[data-screen="00"] .mn li{min-height:36px;display:flex;align-items:center;color:#4a4542}
.s[data-screen="00"] .mn .on,.s[data-screen="00"] .mn details.on>summary{color:#8a6a45;font-weight:600}
.s[data-screen="00"]{gap:14px}
.s[data-screen="00"] .mn a,.s[data-screen="00"] .mn details>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;color:#212020;text-decoration:none;font-size:13px}

:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid #ded5c7;text-decoration:none;color:#212020;font:400 14px/1.35 Open Sans,sans-serif\"><span style=\"color:#8a6a45;min-width:12px\">3<\/span><span>Apostar em como você se sentirá ao terminar.<\/span><\/a><a href=\"#\" data-go=\"15\" style=\"display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid #ded5c7;text-decoration:none;color:#212020;font:400 14px/1.35 Open Sans,sans-serif\"><span style=\"color:#8a6a45;min-width:12px\">4<\/span><span>Posicioná-la no seu mapa.<\/span><\/a><a href=\"#\" data-go=\"13\" style=\"display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid #ded5c7;text-decoration:none;color:#212020;font:400 14px/1.35 Open Sans,sans-serif\"><span style=\"color:#8a6a45;min-width:12px\">5<\/span><span>Comparar o que você esperava com o que aconteceu.<\/span><\/a><\/details><p style=\"margin:14px 0 0;font:400 14px/1.5 Open Sans,sans-serif;color:#212020\">Assim, com seu mapa, fica mais fácil fluir gentil com a realidade e descobrir em quais expectativas vale a pena apostar para o seu bem-estar.<\/p><button data-story=\"0\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:1px solid #c0b4a2;border-radius:20px;background:#fdfbf9;color:#212020;font:400 13px Open Sans,sans-serif;padding:8px 14px;cursor:pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"><path d=\"M2 3.5h5a2 2 0 0 1 2 2V15a1.6 1.6 0 0 0-1.6-1.6H2zM16 3.5h-5a2 2 0 0 0-2 2V15a1.6 1.6 0 0 1 1.6-1.6H16z\"/><\/svg>Ver a história de Lu<\/button>\n<details class=\"inf\"><summary><span class=\"ii\">i<\/span>O que há debaixo do capô?<\/summary><div class=\"ip\"><p>ESTIMAT é um aplicativo web voltado à reflexão pessoal, ao planejamento de atividades e ao acompanhamento do bem-estar subjetivo.<\/p><p style=\"margin-top:8px\">Ele orienta você a identificar valores e objetivos pessoais e a organizá-los em algo que chamamos de mapa de expectativas.<\/p><p style=\"margin-top:8px\">Com isso, você planeja atividades significativas e compara suas previsões sobre elas com o que viveu, para atualizar suas crenças sobre você.<\/p><p style=\"margin-top:8px\">A estrutura do app se apoia principalmente em cibernética, teoria da informação, previsão afetiva e atualização bayesiana.<\/p><p style=\"margin-top:8px\">Os dados ficam no próprio aparelho, sem cadastro.<\/p><p style=\"margin-top:12px;border-top:1px solid #ded5c7;padding-top:10px\"><\/p><p><b>Sem um mapa, é fácil se perder.<\/b><\/p><p style=\"margin-top:8px\">Temos incontáveis fluxos em redes, que formariam nossos valores, e cada pessoa forma um mapa único. Pode não ser fácil.<\/p><p style=\"margin-top:8px\"><b>De todo o nosso mar de informação, como saber por qual valor é melhor apostar?<\/b><\/p><p style=\"margin-top:8px\">Não podemos oferecer uma resposta.<\/p><p style=\"margin-top:8px\">Mas podemos oferecer uma metodologia pessoal para ajudar você a filtrar suas respostas em uma tempestade de informação.<\/p><p style=\"margin-top:8px\">Um mapa da sua informação.<\/p><p style=\"margin-top:8px\">Assim você poderá se avaliar conforme sua realidade, fazendo as melhores apostas possíveis nos seus valores.<\/p><p style=\"margin-top:8px\">Filtre cada atividade importante com o seu mapa. Aposte, aja, contraste e atualize o que você estima.<\/p><p style=\"margin-top:8px\">*O mapa não é o território, é uma simplificação para navegar.<\/p><\/div><\/details>\n", "04": "<h1 class=\"t\" style=\"margin:4px 0 14px\"><span style=\"color:#8a6a45\">1 · <\/span>Seu mapa de expectativas<\/h1><div style=\"display:flex;justify-content:center\"><svg viewBox=\"0 0 342 300\" width=\"342\" height=\"300\" role=\"img\" aria-label=\"Rio com entrada à esquerda, processo no centro e saída à direita. Uma roda d'água sobre o processo gira quando a água passa. Uma linha de retroalimentação leva a saída de  saída, com teoria cibernética.<\/p><p style=\"margin-top:8px\">Na segunda parte, para simplificar seus objetivos, mapearemos seus níveis de foco por sua função:<\/p><p style=\"margin-top:8px\">social como integrador<br>emocional como ponderador<br>racional como prognosticador<br>corporal como reacionador<\/p><p class=\"tg\">#cibernética #busca binária #dividir para conquistar #teoria da informação<\/p><\/div><\/details><\/div><\/div>", "05": "<div><details class=\"inf pi\"><summary><h1 style=\"color: #212020; font: 500 30px / 1.15 &quot;Cormorant Garamond&quot;, serif; margin: 0px\">Entrada e saída<\/h1><span class=\"tt\"><br><\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p><b>Entrada:<\/b><br>O que você busca do mundo para si, para dentro;<\/p><p style=\"margin-top:8px\"><b>Saída:<\/b><br>O que você oferece de si ao mundo, para fora.<\/p><p style=\"margin-top:8px\">Comece com uma palavra-chave que será usada por você. Se não for tão fácil, abaixo há um experimento mental que pode ajudar.<\/p><p class=\"tg\">#cibernética<\/p><\/div><\/details><\/div>\n\n<div style=\"display:flex;margin-top:28px\">\n<div style=\"flex:1;text-align:center;padding:0 10px;border-right:1px solid #ded5c7\">\n\n<div class=\"p\" style=\"font-size:13px;margin-top:6px\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:50%;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(33,32,32,.55);margin-right:7px;vertical-align:-1px\"><\/span>Entrada<\/div>\n<textarea data-bind=\"flow.in\" aria-label=\"Valores que você quer conquistar\" placeholder=\"Escreva o valor que quer conquistar:\" style=\"display:block;box-sizing:border-box;width:100%;height:96px;margin-top:12px;padding:10px 12px;border:1px solid #c0b4a2;border-radius:12px;background:transparent;color:#212020;font-family:'Open Sans',sans-serif;font-size:13px;line-height:19px;resize:none;text-align:left\"><\/textarea>\n<\/div>\n<div style=\"flex:1;text-align:center;padding:0 10px\">\n\n<div class=\"p\" style=\"font-size:13px;margin-top:6px\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:50%;background:#212020;box-shadow:inset 0 0 0 1px rgba(33,32,32,.55);margin-right:7px;vertical-align:-1px\"><\/span>Saída<\/div>\n<textarea data-bind=\"flow.out\" aria-label=\"Valores que você quer ofertar\" placeholder=\"Escreva qual valor quer ofertar:\" style=\"display:block;box-sizing:border-box;width:100%;height:96px;margin-top:12px;padding:10px 12px;border:1px solid #c0b4a2;border-radius:12px;background:transparent;color:#212020;font-family:'Open Sans',sans-serif;font-size:13px;line-height:19px;resize:none;text-align:left\"><\/textarea>\n<\/div>\n<\/div><svg viewBox=\"0 0 342 150\" width=\"342\" height=\"150\" role=\"img\" aria-label=\"Rio que vai da entrada, à esquerda, à saída, à direita. Cada ponto está ligado por uma linha à sua caixa de texto acima. Uma linha de retroalimentação leva a saída de volta à entrada\"><defs><path id=\"rv\" d=\"M0 70H342\"><\/path><\/defs><g fill=\"none\"><use href=\"#rv\" stroke=\"#c0b4a2\" stroke-width=\"22\"><\/use><use href=\"#rv\" stroke=\"#f8f4ee\" stroke-width=\"18\"><\/use><use href=\"#rv\" stroke=\"#4c9bb3\" stroke-width=\"8\"><\/use><\/g><g stroke=\"#4a4542\" stroke-width=\"1.5\"><path d=\"M40 0V64\"><\/path><path d=\"M302 0V64\"><\/path><\/g><g fill=\"#212020\"><circle cx=\"40\" cy=\"70\" r=\"5\"><\/circle><circle cx=\"171\" cy=\"70\" r=\"5\"><\/circle><circle cx=\"302\" cy=\"70\" r=\"5\"><\/circle><\/g><path d=\"M302 92V130H44V100\" fill=\"none\" stroke=\"#4a4542\" stroke-width=\"1.5\"><\/path><path d=\"M38 102L44 90L50 102z\" fill=\"#4a4542\"><\/path><\/svg><p class=\"p\" style=\"margin-bottom:20px\"><br><\/p><details style=\"margin-bottom:16px\"><div style=\"box-sizing: border-box; padding: 14px 16px; border: 1px solid #ded5c7; border-radius: 14px; background: #fdfbf9; font-size: 12px; line-height: 23px; font-family: Open Sans, sans-serif\">Imagine que você vai perder totalmente a memória e tem um minuto para escrever dois valores para orientar seu \"eu do futuro\". <br>Em quais valores seu \"eu do futuro\" deveria se concentrar?<\/div><summary aria-label=\"Ver experimento mental\" style=\"display:flex;align-items:center;min-height:44px;cursor:pointer;list-style:none\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;box-sizing:border-box;border:1px solid #212020;border-radius:50%;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:#212020\">!<\/span><span style=\"margin-left:10px;font-family:'Open Sans',sans-serif;font-size:13px;color:#212020\">Experimento mental<\/span><\/summary><\/details>", "06": "<h1 class=\"t\" style=\"margin:4px 0 10px\">Objetivos<\/h1><p class=\"p\" style=\"margin:0 0 14px;text-align:left;font-family:Open Sans,sans-serif;font-size:15px;line-height:23px;color:#212020\">Temos incontáveis coisas para obter e oferecer. E agora?<br>Agora dividiremos o que você quer obter e oferecer em <b>objetivos por níveis<\/b>.<\/p>\n\n<svg viewBox=\"0 0 342 300\" width=\"342\" height=\"300\" role=\"img\" aria-label=\"Rede de canais que se simplifica: oito canais sociais, quatro emocionais, dois racionais e um corporal. A água entra pela direita, chega ao nível corporal e sobe até a social, acendendo a cor de cado nível. Quando a água para de subir, desce de cima para baixo e sai pelo canal da esquerda do nível corporal\"><defs><path id=\"nc\" d=\"M0 292H196Q220 292 220 268V250\"><\/path><path id=\"nc2\" d=\"M342 292H244Q220 292 220 268V250\"><\/path><path id=\"nr\" d=\"M160 180C160 215 220 215 220 250M280 180C280 215 220 215 220 250\"><\/path><path id=\"nm\" d=\"M130 110C130 145 160 145 160 180M190 110C190 145 160 145 160 180M250 110C250 145 280 145 280 180M310 110C310 145 280 145 280 180\"><\/path><path id=\"ns\" d=\"M115 40C115 75 130 75 130 110M145 40C145 75 130 75 130 110M175 40C175 75 190 75 190 110M205 40C205 75 190 75 190 110M235 40C235 75 250 75 250 110M26 xo do capô?<\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p style=\"margin-top:8px\">Para simplificar, buscamos perguntas de impacto (como em uma árvore de decisão) que dividam os dados ou nossas opções em partes iguais (50/50).<\/p><p style=\"margin-top:8px\">Onde apostar? As perguntas-chave dividem nossos fluxos em níveis de complexidade. Ao aplicá-las para reduzir a incerteza sobre nós, podemos alinhar nossas ações com nossos valores com menos esforço. Como funciona?<\/p><p style=\"margin-top:8px\"><b>O exemplo do assassino 🔪<\/b><\/p><p style=\"margin-top:8px\">Imagine que você procura um assassino entre 1.000 suspeitos:<\/p><ul style=\"margin:8px 0 0 18px;padding:0\"><li><b>Pergunta de impacto (50/50):<\/b> \"É homem ou mulher?\" 👉 De uma só vez, você descarta 500 pessoas, não importa qual seja a resposta.<\/li><li style=\"margin-top:6px\"><b>Pergunta ineficiente:<\/b> \"Tem olhos azuis?\" 👉 Se tiver sorte, descarta alguns poucos. Se não, fica quase igual e precisa fazer dezenas de perguntas a mais.<\/li><\/ul><p style=\"margin-top:8px\">Então, para mapear e melhorar a nós como um sistema, a chave não é fazer muitas perguntas, mas encontrar as poucas perguntas de impacto que filtram metade das possibilidades de uma só vez.<\/p><p style=\"margin-top:8px\">Um nível não vale mais que outro. Apenas inclui o anterior.<\/p><p class=\"tg\">#dividir para conquistar #busca binária #teoria da informação #mente barco<\/p><\/div><\/details><\/div>\n", "07": "<div style=\"margin:0 0 10px\"><p style=\"margin:0 0 2px;font:400 13px var(--sans);color:#6e6762\">De <span data-goals><\/span>,<\/p><h1 class=\"t\" style=\"margin:0;font-size:26px;line-height:1.2\">O que depende sobretudo de outros seres?<\/h1><\/div><div style=\"display:flex;justify-content:center\"><svg viewBox=\"100 24 240 100\" width=\"183\" height=\"76\" role=\"img\" aria-label=\"Ramos do nível social: 8 canais que descem até as 4 bolinhas azuis do nível emocional\"><g f idth:100%;height:84px;border:none;background:transparent;color:#212020;font-family:'Open Sans',sans-serif;font-size:15px;line-height:22px;resize:none;outline:none\"><\/textarea><\/div><div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;background:#8c4737;margin-right:10px;flex-shrink:0\"><\/span>Corporal Reacionador<span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:6px 0 10px\"><div class=\"ik\">Processo reacionador<\/div><p>O que você faz sem precisar de informação nem de entender: sensações, comida, treino.<\/p><div class=\"ik\">Como chegamos aqui<\/div><p>Perguntas 1, 2 e 3: não. Resta o automático.<\/p><div class=\"ik\">O que subtrai<\/div><p>Subtrai a informação. Reduz a dependência de entender.<\/p><div class=\"ik\">Foca mais em<\/div><p>o automático.<\/p><div class=\"ik\">Certeza e potencial<\/div><p>É o mais certo e o de menor potencial de resultados.<\/p><div class=\"ik\">Exemplos<\/div><ul><li>Quero dormir oito horas.<\/li><li>Quero treinar três vezes por semana.<\/li><li>Quero comer sem pressa.<\/li><\/ul><p style=\"margin-top:10px;color:#4a4542\">Não é absoluto. É relativo a você e aos seus outros valores.<\/p><\/div><\/details><\/div>", "11": "<input class=\"rd\" type=\"radio\" name=\"dim\" id=\"d1\" checked=\"\"><input class=\"rd\" type=\"radio\" name=\"dim\" id=\"d2\"><input class=\"rd\" type=\"radio\" name=\"dim\" id=\"d3\"><input class=\"rd\" type=\"radio\" name=\"dim\" id=\"d4\"><div class=\"k\">SEU MAPEAMENTO DE FLUXO E NÍVEL:<\/div><div class=\"dt\"><div class=\"tx d1\"><div class=\"tl\">ENTRADA<\/div><div class=\"tv\">[Texto que escribiste en tu entrada]<\/div><div class=\"tl\">SALIDA<\/div><div class=\"tv\">[Texto que escribiste en tu salida ]<\/div><\/div><div class=\"tx d2\"><div class=\"tl\">Emocional · Entrada<\/div><div class=\"tv\">[Texto que escribiste en tu entrada emocional]<\/div><div class=\"tl\">Emocional · Salida<\/div><div class=\"tv\">[Texto que escribiste en tu salida emocional]<\/div><\/div><div class=\"tx d3\"><div class=\"tl\">Racional · Entrada<\/div><div class=\"tv\">[Texto que escribiste en tu entrada racional]<\/div><div class=\"tl\">Racional · Salida<\/div><div class=\"tv\">[Texto que escribiste en tu salida racional]<\/div><\/div><div class=\"tx d4\"><div class=\"tl\">Corporal · Entrada<\/div><div class=\"tv\">[Texto que escribiste en tu entrada corporal]<\/div><div class=\"tl\">Corporal · Salida<\/div><div class=\"tv\">[Texto que escribiste en tu salida corporal]<\/div><\/div><\/div><div class=\"bt\"><\/div><div class=\"cl d1\" style=\"--c: #7b7d55; width: 340px\"><span class=\"ct\">Social<\/span>[Tu entrada social]<\/div><div class=\"cl d2\" style=\"--c: #efd49f\"><span class=\"ct\">Emocional<\/span>[Tu salida emocional]<\/div><div class=\"cl d3\" style=\"--c: #bf9268\"><span class=\"ct\">Racional<\/span>[Tu salida racional]<\/div><div class=\"cl d4\" style=\"--c: #8c4737\"><span class=\"ct\">Corporal<\/span>[Tu salida corporal]<\/div><div class=\"mp\"><\/div>\n\n", "12": "<h1 class=\"t\" style=\"margin:4px 0 10px\">Atividade para apostar em você<\/h1><div class=\"pl\"><svg viewBox=\"0 0 64 548\" width=\"64\" height=\"548\" role=\"img\" aria-label=\"Tubulação vertical: ao preencher as quatro caixas, a água sobe até a atividade ideal\" style=\"display:block\">\n<defs><clipPath id=\"ch\"><rect x=\"16\" y=\"10\" width=\"16\" height=\"550\"><\/rect><\/clipPath><\/defs>\n<path d=\"M24 560V10\" stroke=\"#ded5c7\" stroke-width=\"26\" stroke-linecap=\"round\" fill=\"none\"><\/path>\n<path d=\"M24 560V10\" stroke=\"#f8f4ee\" stroke-width=\"16\" stroke-linecap=\"round\" fill=\"none\"><\/path>\n<g clip-path=\"url(#ch)\"><rect class=\"wt\" x=\"16\" y=\"0\" width=\"16\" height=\"560\" fill=\"#4c9bb3\"><\/rect><rect class=\"pu\" x=\"16\" y=\"0\" width=\"16\" height=\"34\" rx=\"8\" fill=\"#8a6a45\"><\/rect><\/g>\n<path d=\"M29 73H64\" stroke=\"#c0b4a2\" stroke-width=\"1.5\"><\/path><path d=\"M29 213H64\" stroke=\"#c0b4a2\" stroke-width=\"1.5\"><\/path><path d=\"M29 353H64\" stroke=\"#c0b4a2\" stroke-width=\"1.5\"><\/path><path d=\"M29 493H64\" stroke=\"#c0b4a2\" stroke-width=\"1.5\"><\/path>\n<circle class=\"nd up\" cx=\"24\" cy=\"73\" r=\"5.5\"><\/circle><circle class=\"nd up\" cx=\"24\" cy=\"213\" r=\"5.5\"><\/circle><circle class=\"nd up\" cx=\"24\" cy=\"353\" r=\"5.5\"><\/circle><circle class=\"nd\" cx=\"24\" cy=\"493\" r=\"5.5\"><\/circle>\n<path class=\"gh\" d=\"M10 345L22 341L38 345L40 359L28 366L12 362Z\" fill=\"none\" stroke=\"#4a4542\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"><\/path>\n<path class=\"ob\" d=\"M10 345L22 341L38 345L40 359L28 366L12 362Z\" fill=\"#8c4737\"><\/path>\n<\/svg><div class=\"bs\"><div class=\"bk\"><label class=\"lb\" for=\"ideal\">Ideal<\/label><textarea id=\"ideal\" data-bind=\"activity.ideal\" aria-label=\"Atividade ideal\" placeholder=\"Qual é o melhor resultado que quero alcançar?\"><\/textarea><\/div><div class=\"bk\"><label class=\"lb\" for=\"sign\">Significativa<\/label><textarea id=\"sign\" data-bind=\"activity.sign\" aria-label=\"Atividade significativa\" placeholder=\"Que pequena ação me permitirá avançar ou descobrir algo útil?\"><\/textarea><\/div><div class=\"bk\"><label class=\"lb lo\" for=\"obst\">Obstáculo<\/label><textarea id=\"obst\" data-bind=\"activity.obst\" aria-label=\"Obstáculo\" placeholder=\"O que poderia dificultar meu avanço, dentro ou fora de mim?\"><\/textarea><\/div><div class=\"bk\"><label class=\"lb\" for=\"resp\">PLANO<\/label><textarea id=\"resp\" data-bind=\"activity.plan\" aria-label=\"Resposta ao obstáculo\" placeholder=\"Se esse obstáculo aparecer, o que farei?\"><\/textarea><\/div><\/div><\/div>\n<div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"margin-right:10px;font-family:Open Sans,sans-serif;font-size:13px;color:#212020\">O que há debaixo do capô?<\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><div>Defina algo que você possa fazer, mesmo se o dia complicar.<br><div><p>Defina o que você gostaria de conseguir, sem confundir desejo com garantia.<br>Obstáculo<br>«Se eu me frustrar, reduzirei a tarefa a cinco minutos». Ou: «Se me faltar uma ferramenta, buscarei uma alternativa».<\/p><\/div><div><div><\/div><div><p><\/p><\/div><\/div><\/div><p class=\"tg\">#ciência do comportamento<\/p><\/div><\/details><\/div>\n", "13": "<h1 class=\"t\" style=\"margin:4px 0 10px\">Atividade, retroavaliação<\/h1><p class=\"p\" style=\"margin:0 0 14px;font-family:Open Sans,sans-serif;font-size:15px;line-height:23px;color:#212020\">Preencha cada recipiente conforme como você se sentiu ao terminar sua última atividade, ou avalie sua última semana como base.<\/p><div data-card=\"retro\"><\/div>\n\n<div class=\"vrow\" data-vessels=\"retro\"><\/div>\n<div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"margin-right:10px;font-family:Open Sans,sans-serif;font-size:13px;color:#212020\">O que há debaixo do capô?<\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p>Nossa base de avaliação é a motivação e a satisfação. Às vezes estamos muito motivados sem estar muito satisfeitos. E às vezes estamos muito satisfeitos sem estar muito motivados.<\/p><p>Por exemplo, quero comprar o telefone novo X. Estou muito motivado, mas ao comprá-lo não me dá tanta satisfação quanto eu esperava.<\/p><p>Ou às vezes dou a um vizinho a resposta ácida que queria dar. Tinha pouca motivação para dá-la, mas fiquei muito satisfeito.<\/p><p>Por isso avaliaremos, como base, a motivação e a satisfação.&nbsp;<\/p>\n<p>Avalie assim que terminar. Com os dias, a memória suaviza o vivido.<\/p>\n<p>O recipiente mostra uma proporção, sem pedir números. Ajuda a sair do tudo ou nada, um viés descrito na terapia cognitiva (Beck, 1963). Que ele o reduza é uma hipótese.<\/p><p style=\"margin-top:8px\">Inspira-se em escalas testadas: as escalas visuais analógicas, usadas desde os anos 1920 (Scott, 1920; Hayes e Patterson, 1921), e a satisfação com a vida de 0 a 10 usada pelo WELLBY (Tesouro do Reino Unido, 2021). Seu recipiente mede uma atividade, não sua vida. Essa validade não se transfere sozinha.<\/p><p style=\"margin-top:8px\">Avalie sem olhar sua aposta. Depois aparece a linha pontilhada dela, para comparar.<\/p><p class=\"tg\" style=\"color: #8a6a45\">#neurociência afetiva<\/p><\/div><\/details><\/div>\n", "14": "<h1 class=\"t\" style=\"margin:4px 0 10px\">Atividade, aposta<\/h1><p class=\"p\" style=\"margin:0 0 14px;font-family:Open Sans,sans-serif;font-size:15px;line-height:23px;color:#212020\">Preencha cada recipiente conforme como você vai se sentir ao terminar a atividade.<\/p><div data-card=\"pron\"><\/div>\n<div class=\"vrow\" data-vessels=\"pron\"><\/div>\n<div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"margin-right:10px;font-family:Open Sans,sans-serif;font-size:13px;color:#212020\">O que há debaixo do capô?<\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p>Aqui você não marca o que tem hoje. Você marca sua aposta: como prevê se sentir ao terminar sua atividade. É um estado final, não uma mudança.<\/p><p>Nossa base de avaliação é a motivação e a satisfação. Às vezes estamos muito motivados sem estar muito satisfeitos. E às vezes estamos muito satisfeitos sem estar muito motivados.<\/p><p>Por exemplo, quero comprar o telefone novo X. Estou muito motivado, mas ao comprá-lo não me dá tanta satisfação quanto eu esperava.<\/p><p>Ou às vezes dou a um vizinho a resposta ácida que queria dar. Tinha pouca motivação para dá-la, mas fiquei muito satisfeito.<\/p><p>Por isso avaliaremos, como base, a motivação e a satisfação. Então, de todo o nosso mar de informação, por qual parte deveríamos apostar?<\/p>\n<p>Sua aposta é um prognóstico. Esperar mais do que acontece é normal. Não é um defeito.<\/p>\n<p>O recipiente mostra uma proporção, sem pedir números. Ajuda a sair do tudo ou nada, um viés descrito na terapia cognitiva (Beck, 1963). Que ele o reduza é uma hipótese.<\/p><p style=\"margin-top:8px\">Inspira-se em escalas testadas: as escalas visuais analógicas, usadas desde os anos 1920 (Scott, 1920; Hayes e Patterson, 1921), e a satisfação com a vida de 0 a 10 usada pelo WELLBY (Tesouro do Reino Unido, 2021). Seu recipiente mede uma atividade, não sua vida. Essa validade não se transfere sozinha.<\/p><p class=\"tg\" style=\"color: #8a6a45\">#neurociência afetiva<\/p><\/div><\/details><\/div>\n", "15": "<div style=\"margin: 12px 0 10px; font-size: 20px; color: #8a6a45; font-family: Open Sans, sans-serif\"><h1 class=\"t\" style=\"color: #212020; font-family: &quot;Cormorant Garamond&quot;, serif\">Qual é o foco da sua atividade?<\/h1><p style=\"margin:0;font:400 13px/1.4 Open Sans,sans-serif;color:#6e6762\">Se obtém e oferece ao mesmo tempo, escolha a intenção principal.<\/p><\/div>\n\n\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n\n\n<\/div><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n\n<button class=\"o\" aria-pressed=\"false\" data-flow=\"c\"><span><svg viewBox=\"0 0 12 12\" width=\"13\" height=\"13\" aria-hidden=\"true\" style=\"flex:none;vertical-align:-1px;margin-right:7px\"><path d=\"M2 1.5L10.5 6L2 10.5Z\" fill=\"#fffffe\" stroke=\"#212020\" stroke-width=\"1\" stroke-linejoin=\"round\"/><\/svg>Visão · obter<\/span><small class=\"kw\" data-kw=\"flow.in\" hidden><\/small><\/button>\n<button class=\"o\" aria-pressed=\"false\" data-flow=\"o\"><span><svg viewBox=\"0 0 12 12\" width=\"13\" height=\"13\" aria-hidden=\"true\" style=\"flex:none;vertical-align:-1px;margin-right:7px\"><path d=\"M2 1.5L10.5 6L2 10.5Z\" fill=\"#212020\" stroke=\"#212020\" stroke-width=\"1\" stroke-linejoin=\"round\"/><\/svg>Missão · oferecer<\/span><small class=\"kw\" data-kw=\"flow.out\" hidden><\/small><\/button>\n\n<\/div><svg viewBo app.addEventListener('toggle',function(e){var d=e.target;if(d.tagName==='DETAILS'&&d.open&&d.getAttribute('name')){$$('details[name="'+d.getAttribute('name')+'"]').forEach(function(x){if(x!==d)x.open=false;});}},true);
app.addEventListener('click',function(e){
  var t=e.target, el;
  if(t.closest('[data-back]')){go(backTo);return;}
  if((el=t.closest('[data-lang]'))){setLang(el.getAttribute('data-lang'));return;}
  if((el=t.closest('[data-story]'))){STORY=+el.getAttribute('data-story');render();var sc=$('.app .s');if(sc)sc.scrollTop=0;return;}
  if(t.closest('[data-story-close]')){STORY=-1;render();return;}
  if(t.closest('[data-num]')){var on=!document.body.classList.contains('shownum');document.body.classList.toggle('shownum',on);try{localStorage.setItem('estimat.num',on?'1':'');}catch(x){}$$('[data-num]').forEach(function(b){b.textContent=on?'Ocultar números':'Ver números';});return;}
  if((el=t.closest('[data-afo]'))){var tg=retroTarget(); if(tg.rec&&!tg.base){var v=el.getAttribute('data-afo'), cu=tg.rec.affectO||''; tg.rec.affectO=(cu.slice(0,v.length)===v)?v.slice(0,-1):v; save(); var bx=$('#afo-box'); if(bx) bx.innerHTML=afoBox();} return;}
  if(t.closest('[data-afo-clear]')){var tg2=retroTarget(); if(tg2.rec){tg2.rec.affectO=''; save(); var bx2=$('#afo-box'); if(bx2) bx2.innerHTML=afoBox();} return;}
  if(t.closest('[data-af-clear]')){S.activity.affect='';save();render();return;}
  if((el=t.closest('[data-af]'))){var v=el.getAttribute('data-af');var cur=S.activity.affect||''; S.activity.affect=(cur.slice(0,v.length)===v)?v.slice(0,-1):v;save();render();return;}
  if((el=t.closest('[data-go]'))){e.preventDefault();go(+el.getAttribute('data-go'));return;}
  if((el=t.closest('[data-next]'))){if(!el.disabled)go(next());return;}
  if((el=t.closest('[data-pager]'))){if(!el.disabled)step(el.getAttribute('data-pager')==='next'?1:-1,LAST-1);return;}
  if(t.closest('[data-evo]')){go(18);return;}
  if(t.closest('[data-plus]')){upsertRecord();S.activity=blankAct();save();go(13);return;}
  if(t.closest('[data-reset]')){S.activity=blankAct();save();go(13);return;}
  if(t.closest('[data-inst]')){instalar();return;}
  if(t.closest('[data-diag]')){runDiag();return;}
  if(t.closest('[data-upd]')){try{location.reload();}catch(e){}return;}
  if(t.closest('[data-chk]')){UPD_MSG='';checkUpdate(true);return;}
  if((el=t.closest('[data-dt]'))){dtAct(el.getAttribute('data-dt'),el.closest('[data-datebox]'));return;}
  if((el=t.closest('[data-edit-act]'))){editAct(el.getAttribute('data-edit-act'),el.closest('[data-form]'));return;}
  if(!t.closest('[data-form]')&&(el=t.closest('[data-edit]'))){EV.edit=el.getAttribute('data-edit');render();return;}
  if((el=t.closest('[data-afsel]'))){EV.af=el.getAttribute('data-afsel')==='true';evSave();render();return;}
  if((el=t.closest('[data-cw]'))){EV.cw=el.getAttribute('data-cw')==='true';evSave();render();return;}
  if((el=t.closest('[data-day]'))){EV.day=el.getAttribute('data-day');EV.tab='r';EV.edit=null;render();return;}
  if(t.closest('[data-dayclear]')){EV.day=null;render();return;}
  if((el=t.closest('[data-tab]'))){EV.tab=el.getAttribute('data-tab');EV.msg='';EV.confirm=false;render();return;}
  if((el=t.closest('[data-open]'))){var k=el.getAttribute('data-open');EV.open=EV.open===k?null:k;render();return;}
  if((el=t.closest('[data-chip]'))){chip(el.getAttribute('data-chip'));return;}
  if((el=t.closest('[data-data]'))){dataAction(el.getAttribute('data-data'));return;}
});
app.addEventListener('input',function(e){var t=e.target;if(t.type==='range'&&t.closest('[data-form]')){var o=t.closest('[data-form]').querySelector('[data-o="'+t.getAttribute('data-f')+'"]');if(o)o.textContent=t.value+'%';}});
app.addEventListener('keydown',function(e){var el=e.target.closest&&e.target.closest('[data-edit]');if(el&&e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();EV.edit=el.getAttribute('data-edit');render();}});
app.addEventListener('focusin',function(e){
  var t=e.target; if(t.tagName==='TEXTAREA'||t.tagName==='INPUT') setTimeout(function(){try{t.scrollIntoView({block:'center',behavior:'smooth'});}catch(x){}},320);
});
/* modo presentación en escritorio: escala el contenido para llenar la altura */
function fit(){
  var gp=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'))||0, d=innerWidth>=900&&innerHeight>=560, z=d?Math.max(1,Math.min(1.7,(innerHeight-gp)/760)):1;
  app.style.setProperty('--z',z.toFixed(3));
}
fit(); window.addEventListener('resize',fit);
setTimeout(function(){checkUpdate(false);},3000);
document.addEventListener('visibilitychange',function(){if(!document.hidden) checkUpdate(false);});
setInterval(function(){if(!document.hidden) checkUpdate(false);},1800000);
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',function(){
    var vv=window.visualViewport;
    if(vv.height<window.innerHeight-120){app.style.height=vv.height+'px';app.style.maxHeight='none';} else {app.style.height='';app.style.maxHeight='';}
  });
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.ix')) $$('details.ix[open]').forEach(function(d){d.open=false;});
});

/* deslizar a los lados y flechas del teclado */
(function(){
  var x0=0,y0=0,ok=false;
  var skip=function(t){return t.closest&&t.closest('.vsvg,textarea,input,.mn,.pager,svg[role=slider]');};
  app.addEventListener('touchstart',function(e){var t=e.touches[0];x0=t.clientX;y0=t.clientY;ok=e.touches.length===1&&!skip(e.target);},{passive:true});
  app.addEventListener('touchend',function(e){
    if(!ok||cur===18||cur===19) return; ok=false;
    var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){ if(dx<0) step(1,LAST-1); else if(dx>0) step(-1,LAST-1); }
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(cur===18||cur===19||e.altKey||e.ctrlKey||e.metaKey) return;
    var t=e.target; if(t&&(/^(TEXTAREA|INPUT|SELECT)$/.test(t.tagName)||t.getAttribute&&t.getAttribute('role')==='slider')) return;
    if(e.key==='ArrowRight'){step(1,LAST-1);} else if(e.key==='ArrowLeft'){step(-1,LAST-1);}
  });
})();
(function(){var mapped=!!(S.flow.in||S.flow.out||S.records.length||DIMS.some(function(d){return S.dim[d[0]];})); if(mapped) cur=13;})();
render();
})();
