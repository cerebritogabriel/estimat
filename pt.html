<style>
/* Layout: una columna tipo teléfono (390 x 844) centrada; en móvil ocupa toda la pantalla. */
:root{
  --bg:#f8f4ee; --stage:#ece5da; --ink:#212020; --ink-soft:#4a4542; --ink-mute:#6e6762;
  --water:#4c9bb3; --line:#c0b4a2; --line-soft:#ded5c7; --panel:#fdfbf9; --accent:#8a6a45;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
:root{--gap:84px}
@media (display-mode: standalone){:root{--gap:0px}}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--sans);display:grid;place-items:start center;overflow:hidden}
.app{width:100%;max-width:430px;height:100%;max-height:900px;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:560px) and (min-height:720px){
  body{place-items:center}
  .app{height:min(100%,844px);border-radius:30px;border:1px solid #ded5c7;box-shadow:0 30px 80px rgba(90,76,58,.18)}
}
.s[data-screen="00"]{width:390px;height:844px;box-sizing:border-box;padding:36px 24px 32px;background:#f8f4ee;display:flex;flex-direction:column;font-family:"Cormorant Garamond",serif;font-weight:500;color:#212020}
.s[data-screen="00"] .w{margin:0 0 24px;font-size:14px;letter-spacing:.3em;text-transform:uppercase}
.s[data-screen="00"] .b{margin-top:auto;align-self:center;width:210px;height:48px;border:1px solid #212020;border-radius:24px;background:transparent;color:#212020;font-family:inherit;font-weight:500;font-size:18px;cursor:pointer}
.s[data-screen="00"] a.b{display:flex;align-items:center;justify-content:center;box-sizing:border-box;text-decoration:none}
.s[data-screen="00"] .t{margin:0 0 12px;font-weight:500;font-size:28px;line-height:34px}
.s[data-screen="00"] .p{margin:0;font-size:18px;line-height:25px;color:#4a4542;text-align:center}
.s[data-screen="00"] .o{min-height:48px;border:1px solid #c0b4a2;border-radius:14px;background:transparent;color:#212020;font-family:inherit;font-weight:500;font-size:18px;cursor:pointer}
.s[data-screen="00"] .o[aria-pressed=true]{background:#ece3d6;border-color:#8a6a45}
.s[data-screen="00"] .f{box-sizing:border-box;padding:10px 16px 6px;border:1px solid #c0b4a2;border-radius:14px;display:flex;flex-direction:column}
.s[data-screen="00"] .f label{font-size:18px}
.s[data-screen="00"] .f input{border:none;border-bottom:1px solid #c0b4a2;background:transparent;color:#212020;font-family:inherit;font-weight:500;font-size:17px;padding:6px 0}
.s[data-screen="00"] input::placeholder{color:#6e6762}
.s[data-screen="00"] .wf{stroke-dasharray:100 100;animation:wf-00 6s ease-in-out infinite}
@keyframes wf-00{0%{stroke-dashoffset:100}55%{stroke-dashoffset:0}80%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
@media (prefers-reduced-motion:reduce){.s[data-screen="00"] .wf{animation:none;stroke-dashoffset:0}}
.s[data-screen="00"] .w{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5;margin:0 0 6px}
.s[data-screen="00"] .ix{position:relative}
.s[data-screen="00"] .ix>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;padding-left:12px;font-family:"Open Sans",sans-serif;font-size:12px;font-weight:500;letter-spacing:.03em;text-transform:none;color:#212020}
.s[data-screen="00"] .ix>summary::-webkit-details-marker{display:none}
.s[data-screen="00"] .ix>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid #212020;border-bottom:1.5px solid #212020;transform:rotate(45deg);margin-top:-3px}
.s[data-screen="00"] .mn{position:absolute;right:0;top:100%;width:230px;box-sizing:border-box;padding:6px 14px;background:#fdfbf9;border:1px solid #ded5c7;border-radius:14px;font-family:"Open Sans",sans-serif;font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;z-index:20}
.s[data-screen="00"] .mn details>summary,.s[data-screen="00"] .mn .gr{list-style:none;cursor:pointer;min-height:42px;display:flex;align-items:center;color:#212020}
.s[data-screen="00"] .mn details>summary::-webkit-details-marker{display:none}
.s[data-screen="00"] .mn ul{margin:0 0 6px;padding:0 0 0 14px;list-style:none}
.s[data-screen="00"] .mn li{min-height:36px;display:flex;align-items:center;color:#4a4542}
.s[data-screen="00"] .mn .on,.s[data-screen="00"] .mn details.on>summary{color:#8a6a45;font-weight:600}
.s[data-screen="00"]{gap:14px}
.s[data-screen="00"] .mn a,.s[data-screen="00"] .mn details>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;color:#212020;text-decoration:none;font-size:13px}

45;min-width:12px\">1<\/span><span>Definir a ação.<\/span><\/a><a href=\"#\" data-go=\"14\" style=\"display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid #ded5c7;text-decoration:none;color:#212020;font:400 14px/1.35 Open Sans,sans-serif\"><span style=\"color:#8a6a45;min-width:12px\">2<\/span><span>Rotular como você se sente.<\/span><\/a><a href=\"#\" data-go=\"14\" style=\"display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid #ded5c7;text-decoration:none;color:#212020;font:400 14px/1.35 Open Sans,sans-serif\"><span style=\"color:#8a6a45;min-width:12px\">3<\/span><span>Prever quanta motivação você vai investir e quanta satisfação vai conquistar.<\/span><\/a><a href=\"#\" data-go=\"14\" style=\"display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid #ded5c7;text-decoration:none;color:#212020;font:400 14px/1.35 Open Sans,sans-serif\"><span style=\"color:#8a6a45;min-width:12px\">4<\/span><span>Posicioná-la no seu mapa.<\/span><\/a><\/details><details name=\"p03\" class=\"acc\" style=\"border-bottom:1px solid #ded5c7\"><summary style=\"list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;font:600 13px Open Sans,sans-serif;letter-spacing:.02em;color:#8a6a45\"><span>3. Comparar o retorno<\/span><svg class=\"chev\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex:none;transition:transform .2s\"><path d=\"M4 6l4 4 4-4\"/><\/svg><\/summary><a href=\"#\" data-go=\"13\" style=\"display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid #ded5c7;text-decoration:none;color:#212020;font:400 14px/1.35 Open Sans,sans-serif\"><span style=\"color:#8a6a45;min-width:12px\">1<\/span><span>Comparar o retorno com o que você esperava.<\/span><\/a><a href=\"#\" data-go=\"18\" style=\"display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid #ded5c7;text-decoration:none;color:#212020;font:400 14px/1.35 Open Sans,sans-serif\"><span style=\"color:#8a6a45;min-width:12px\">2<\/span><span>Analisar sua evolução e ajustar onde investir.<\/span><\/a><\/details><p style=\"margin:14px 0 0;font:400 14px/1.5 Open Sans,sans-serif;color:#212020\">Assim, com seu mapa, fica mais fácil fluir gentil com a realidade e descobrir em quais expectativas vale a pena investir para o seu bem-estar.<\/p>\n<div><button data-story=\"0\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin:0 0 6px;border:1px solid #c0b4a2;border-radius:20px;background:#fdfbf9;color:#212020;font:400 13px Open Sans,sans-serif;padding:8px 14px;cursor:pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"><path d=\"M2 3.5h5a2 2 0 0 1 2 2V15a1.6 1.6 0 0 0-1.6-1.6H2zM16 3.5h-5a2 2 0 0 0-2 2V15a1.6 1.6 0 0 1 1.6-1.6H16z\"/><\/svg>Ver a história de Lu<\/button><details class=\"inf\"><summary><span class=\"ii\">i<\/span>O que há debaixo do capô?<\/summary><div class=\"ip\"><p>ESTIMAT é um app web de reflexão pessoal, planejamento de ações e acompanhamento do bem-estar subjetivo.<\/p><p style=\"margin-top:8px\">Orienta você a identificar suas expectativas e organizá-las no que chamamos de mapa de metas.<\/p><p style=\"margin-top:8px\">Com esse mapa você pode escolher em que ação vale mais investir.<\/p><p style=\"margin-top:8px\">Depois você compara suas previsões com o que viveu, para atualizar suas crenças sobre você.<\/p><p style=\"margin-top:8px\">A estrutura do app se apoia em cibernética, teoria da informação, previsão afetiva e atualização bayesiana.<\/p><p style=\"margin-top:8px\">Seus dados ficam no seu dispositivo, sem criar uma conta.<\/p><p style=\"margin-top:12px;border-top:1px solid #ded5c7;padding-top:10px\"><\/p><p><b>Sem um mapa, é fácil se perder.<\/b><\/p><p style=\"margin-top:8px\">Temos incontáveis fluxos em redes, que formariam nossos valores, e cada pessoa forma um mapa único. Pode não ser fácil.<\/p><p style=\"margin-top:8px\"><b>De todo o nosso mar de informação, como saber em que vale mais investir?<\/b><\/p><p style=\"margin-top:8px\">Não podemos oferecer uma resposta.<\/p><p style=\"margin-top:8px\">Mas podemos oferecer uma metodologia pessoal para ajudar você a filtrar suas respostas em uma tempestade de informação.<\/p><p style=\"margin-top:8px\">Um mapa da sua informação.<\/p><p style=\"margin-top:8px\">Assim você poderá se avaliar conforme sua realidade, fazendo os melhores investimentos possíveis nos seus valores.<\/p><p style=\"margin-top:8px\">Filtre cada ação importante com o seu mapa. Preveja, invista, contraste e atualize o que você estima.<\/p><p style=\"margin-top:8px\">*O mapa não é o território, é uma simplificação para navegar.<\/p><\/div><\/details><\/div>\n", "04": "<h1 class=\"t\" style=\"margin:4px 0 14px\"><span style=\"color:#8a6a45\">1 · <\/span>Mapear expectativas<\/h1><div style=\"display:flex;justify-content:center\"><svg viewBox=\"0 0 342 124\" width=\"342\" height=\"124\" role=\"img\" aria-label=\"Rio do mapa: realizar, conquistar e oferecer, metas por níveis, e revisar\" style=\"display:block;max-width:100%;height:auto;margin:10px auto 6px\"><defs><path id=\"rv04\" d=\"M0 30H342\"><\/path><\/defs><g fill=\"none\"><use href=\"#rv04\" stroke=\"#c0b4a2\" stroke-width=\"22\"><\/use><use href=\"#rv04\" stroke=\"#f8f4ee\" stroke-width=\"18\"><\/use><path class=\"wf\" pathLength=\"100\" d=\"M0 30H342\" stroke=\"#4c9bb3\" stroke-width=\"8\"><\/path><\/g><g fill=\"#212020\"><circle cx=\"40\" cy=\"30\" r=\"5\"><\/circle><circle cx=\"171\" cy=\"30\" r=\"5\"><\/circle><circle cx=\"302\" cy=\"30\" r=\"5\"><\/circle><\/g><path d=\"M302 72V96H44V80\" fill=\"none\" stroke=\"#4a4542\" stroke-width=\"1.5\"><\/path><path d=\"M38 82L44 70L50 82z\" fill=\"#4a4542\"><\/path><circle cx=\"171\" cy=\"96\" r=\"5\" fill=\"#212020\"><\/circle><g font-family=\"Open Sans,sans-serif\" font-size=\"11\" fill=\"#6e6762\" text-anchor=\"middle\"><text x=\"40\" y=\"62\">Realizar<\/text><text x=\"171\" y=\"56\">Conquistar<\/text><text x=\"171\" y=\"68\">e oferecer<\/text><text x=\"302\" y=\"56\">Metas<\/text><text x=\"302\" y=\"68\">por níveis<\/text><text x=\"171\" y=\"117\">revisar<\/text><\/g><\/svg><\/div><p class=\"p\" style=\"margin:16px 0 0;font-family:Open Sans,sans-serif;font-size:15px;line-height:24px\">Para construir seu mapa, você vai imaginar seu eu futuro e responder perguntas que definem e dividem suas metas.<\/p><p class=\"p\" style=\"margin:12px 0 0;font-family:Open Sans,sans-serif;font-size:13px;line-height:20px;font-style:italic;color:#6e6762\">Você para quando tiver confiança suficiente para investir em uma ação.<\/p><div style=\"margin-top:auto\"><div><details class=\"inf pi\"><summary><span style=\"margin-right:10px;font-family:Open Sans,sans-serif;font-size:13px;color:#212020\">O que há debaixo do capô?<\/span><span class=\"tt\"><br><\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p>Mapearemos necessidades e potenciais de fluxo, para saber onde estão seus gargalos e onde se alavancar.<\/p><p style=\"margin-top:8px\">Na primeira parte, mapearemos o que você quer conquistar e oferecer como entrada e saída, com teoria cibernética.<\/p><p style=\"margin-top:8px\">Na segunda parte, para simplificar suas metas, mapearemos seus níveis de foco por sua função:<\/p><p style=\"margin-top:8px\">social como integrador<br>emocional como ponderador<br>racional como prognosticador<br>corporal como reacionador<\/p><p class=\"tg\">#cibernética #busca binária #dividir para conquistar #teoria da informação<\/p><\/div><\/details><\/div><\/div>", "05": "<div><details class=\"inf pi\"><summary><h1 style=\"color: #212020; font: 500 30px / 1.15 &quot;Cormorant Garamond&quot;, serif; margin: 0px\">Entrada e saída<\/h1><span class=\"tt\"><br><\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p><b>Entrada:<\/b><br>O que você busca do mundo para si, para dentro;<\/p><p style=\"margin-top:8px\"><b>Saída:<\/b><br>O que você oferece de si ao mundo, para fora.<\/p><p style=\"margin-top:8px\">Comece com uma palavra-chave que será usada por você. Se não for tão fácil, abaixo há um experimento mental que pode ajudar.<\/p><p class=\"tg\">#cibernética<\/p><\/div><\/details><\/div>\n\n<div style=\"display:flex;margin-top:28px\">\n<div style=\"flex:1;text-align:center;padding:0 10px;border-right:1px solid #ded5c7\">\n\n<div class=\"p\" style=\"font-size:13px;margin-top:6px\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:50%;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(33,32,32,.55);margin-right:7px;vertical-align:-1px\"><\/span>Entrada<\/div>\n<textarea data-bind=\"flow.in\" aria-label=\"Valores que você quer conquistar\" placeholder=\"Escreva o valor que quer conquistar:\" style=\"display:block;box-sizing:border-box;width:100%;height:96px;margin-top:12px;padding:10px 12px;border:1px solid #c0b4a2;border-radius:12px;background:transparent;color:#212020;font-family:'Open Sans',sans-serif;font-size:13px;line-height:19px;resize:none;text-align:left\"><\/textarea>\n<\/div>\n<div style=\"flex:1;text-align:center;padding:0 10px\">\n\n<div class=\"p\" style=\"font-size:13px;margin-top:6px\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:50%;background:#212020;box-shadow:inset 0 0 0 1px rgba(33,32,32,.55);margin-right:7px;vertical-align:-1px\"><\/span>Saída<\/div>\n<textarea data-bind=\"flow.out\" aria-label=\"Valores que você quer ofertar\" placeholder=\"Escreva qual valor quer ofertar:\" style=\"display:block;box-sizing:border-box;width:100%;height:96px;margin-top:12px;padding:10px 12px;border:1px solid #c0b4a2;border-radius:12px;background:transparent;color:#212020;font-family:'Open Sans',sans-serif;font-size:13px;line-height:19px;resize:none;text-align:left\"><\/textarea>\n<\/div>\n<\/div><svg viewBox=\"0 0 342 150\" width=\"342\" height=\"150\" role=\"img\" aria-label=\"Rio que vai da entrada, à esquerda, à saída, à direita. Cada ponto está ligado por uma linha à sua caixa de texto acima. Uma linha de retroalimentação leva a saída de volta à entrada\"><defs><path id=\"rv\" d=\"M0 70H342\"><\/path><\/defs><g fill=\"none\"><use href=\"#rv\" stroke=\"#c0b4a2\" stroke-width=\"22\"><\/use><use href=\"#rv\" stroke=\"#f8f4ee\" stroke-width=\"18\"><\/use><use href=\"#rv\" stroke=\"#4c9bb3\" stroke-width=\"8\"><\/use><\/g><g stroke=\"#4a4542\" stroke-width=\"1.5\"><path d=\"M40 0V64\"><\/path><path d=\"M302 0V64\"><\/path><\/g><g fill=\"#212020\"><circle cx=\"40\" cy=\"70\" r=\"5\"><\/circle><circle cx=\"171\" cy=\"70\" r=\"5\"><\/circle><circle cx=\"302\" cy=\"70\" r=\"5\"><\/circle><\/g><path d=\"M302 92V130H44V100\" fill=\"none\" stroke=\"#4a4542\" stroke-width=\"1.5\"><\/path><path d=\"M38 102L44 90L50 102z\" fill=\"#4a4542\"><\/path><\/svg><p class=\"p\" style=\"margin-bottom:20px\"><br><\/p><details style=\"margin-bottom:16px\"><div style=\"box-sizing: border-box; padding: 14px 16px; border: 1px solid #ded5c7; border-radius: 14px; background: #fdfbf9; font-size: 12px; line-height: 23px; font-family: Open Sans, sans-serif\">Imagine que você vai perder totalmente a memória e tem um minuto para escrever dois valores para orientar seu \"eu do futuro\". <br>Em quais valores seu \"eu do futuro\" deveria se concentrar?<\/div><summary aria-label=\"Ver experimento mental\" style=\"display:flex;align-items:center;min-height:44px;cursor:pointer;list-style:none\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;box-sizing:border-box;border:1px solid #212020;border-radius:50%;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:#212020\">!<\/span><span style=\"margin-left:10px;font-family:'Open Sans',sans-serif;font-size:13px;color:#212020\">Experimento mental<\/span><\/summary><\/details>", "06": "<h1 class=\"t\" style=\"margin:4px 0 10px\">Metas<\/h1><p class=\"p\" style=\"margin:0 0 14px;text-align:left;font-family:Open Sans,sans-serif;font-size:15px;line-height:23px;color:#212020\">Temos incontáveis coisas para conquistar e oferecer. E agora?<br>Agora dividiremos o que você quer conquistar e oferecer em <b>metas por níveis<\/b>.<\/p>\n\n<svg viewBox=\"0 0 342 300\" width=\"342\" height=\"300\" role=\"img\" aria-label=\"Rede de canais que se simplifica: oito canais sociais, quatro emocionais, dois racionais e um corporal. A água entra pela direita, chega ao nível corporal e sobe até a social, acendendo a cor de cado nível. Quando a água para de subir, desce de cima para baixo e sai pelo canal da esquerda do nível corporal\"><defs><path id=\"nc\" d=\"M0 292H196Q220 292 220 268V250\"><\/path><path id=\"nc2\" d=\"M342 292H244Q220 292 220 268V250\"><\/path><path id=\"nr\" d=\"M160 180C160 215 220 215 220 250M280 180C280 215 220 215 220 250\"><\/path><path id=\"nm\" d=\"M130 110C130 145 160 145 160 180M190 110C190 145 160 145 160 180M250 110C250 145 280 145 280 180M310 110C310 145 280 145 280 180\"><\/path><path id=\"ns\" d=\"M115 40C115 75 130 75 130 110M145 40C145 75 130 75 130 110M175 40C175 75 190 75 190 110M205 40C205 75 190 75 190 110M235 40C235 75 250 75 250 110M265 40C265 75 250 75 250 110M295 40C295 75 310 75 310 110M325 40C325 75 310 75 310 110\"><\/path><\/defs><g fill=\"none\"><use href=\"#nc\" stroke=\"#ded5c7\" stroke-width=\"16\"><\/use><use href=\"#nc2\" stroke=\"#ded5c7\" stroke-width=\"16\"><\/use><use href=\"#nr\" stroke=\"#ded5c7\" stroke-width=\"16\"><\/use><use href=\"#nm\" stroke=\"#ded5c7\" stroke-width=\"16\"><\/use><use href=\"#ns\" stroke=\"#ded5c7\" stroke-width=\"16\"><\/use><\/g><g fill=\"none\" class=\"lit lt1\"><animate attributeName=\"opacity\" values=\"0;0;1;1;0\" keyTimes=\"0;0.06;0.1;0.96;1\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.42 0 0.58 1;0 \/circle><circle cx=\"190\" cy=\"110\" r=\"6\"><\/circle><circle cx=\"250\" cy=\"110\" r=\"6\"><\/circle><circle cx=\"310\" cy=\"110\" r=\"6\"><\/circle><circle cx=\"5\" cy=\"111\" r=\"4\"><\/circle><\/g><g class=\"lit lt4\" fill=\"#7b7d55\"><animate attributeName=\"opacity\" values=\"0;0;1;1;0;0\" keyTimes=\"0;0.51;0.55;0.63;0.71;1\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.42 0 0.58 1;0 0 1 1;0.42 0 0.58 1;0 0 1 1\" dur=\"8s\" begin=\"0s\" repeatCount=\"indefinite\"><\/animate><circle cx=\"115\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"145\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"175\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"205\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"235\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"265\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"295\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"325\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"5\" cy=\"41\" r=\"4\"><\/circle><\/g><g fill=\"#212020\" font-family=\"Cormorant Garamond,serif\" font-size=\"17\" font-weight=\"500\"><text x=\"16\" y=\"46\">Social<\/text><text x=\"16\" y=\"116\">Emocional<\/text><text x=\"16\" y=\"186\">Racional<\/text><text x=\"16\" y=\"256\">Corporal<\/text><\/g><\/svg>\n<div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"margin-right:10px;font-family:Open Sans,sans-serif;font-size:13px;color:#212020\">O que há debaixo do capô?<\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p style=\"margin-top:8px\">Para simplificar, buscamos perguntas de impacto (como em uma árvore de decisão) que dividam os dados ou nossas opções em partes iguais (50/50).<\/p><p style=\"margin-top:8px\">Onde investir? As perguntas-chave dividem nossos fluxos em níveis de complexidade. Ao aplicá-las para reduzir a incerteza sobre nós, podemos alinhar nossas ações com nossos valores com menos esforço. Como funciona?<\/p><p style=\"margin-top:8px\"><b>O exemplo do assassino 🔪<\/b><\/p><p style=\"margin-top:8px\">Imagine que você procura um assassino entre 1.000 suspeitos:<\/p><ul style=\"margin:8px 0 0 18px;padding:0\"><li><b>Pergunta de impacto (50/50):<\/b> \"É homem ou mulher?\" 👉 De uma só vez, você descarta 500 pessoas, não importa qual seja a resposta.<\/li><li style=\"margin-top:6px\"><b>Pergunta ineficiente:<\/b> \"Tem olhos azuis?\" 👉 Se tiver sorte, descarta alguns poucos. Se não, fica quase igual e precisa fazer dezenas de perguntas a mais.<\/li><\/ul><p style=\"margin-top:8px\">Então, para mapear e melhorar a nós como um sistema, a chave não é fazer muitas perguntas, mas encontrar as poucas perguntas de impacto que filtram metade das possibilidades de uma só vez.<\/p><p style=\"margin-top:8px\">Um nível não vale mais que outro. Apenas inclui o anterior.<\/p><p class=\"tg\">#dividir para conquistar #busca binária #teoria da informação #mente barco<\/p><\/div><\/details><\/div>\n", "07": "<div style=\"margin:0 0 10px\"><h1 class=\"t\" style=\"margin:0;display:flex;align-items:center;gap:10px\"><span style=\"display:inline-block;width:14px;height:14px;border-radius:50%;background:#7b7d55;flex:none\"><\/span>Social<\/h1><p style=\"margin:4px 0 0;font:400 13px var(--sans);color:#6e6762\">De <span data-goals><\/span>, o que depende sobretudo de outros seres?<\/p><\/div><div style=\"display:flex;justify-content:center\"><svg viewBox=\"100 24 240 100\" width=\"183\" height=\"76\" role=\"img\" aria-label=\"Ramos do nível social: 8 canais que descem até as 4 bolinhas azuis do nível emocional\"><g fill=\"none\"><path d=\"M115 40C115 75 130 75 130 110M145 40C145 75 130 75 130 110M175 40C175 75 190 75 190 110M205 40C205 75 190 75 190 110M235 40C235 75 250 75 250 110M265 40C265 75 250 75 250 110M295 40C295 75 310 75 310 110M325 40C325 75 310 75 310 110\" stroke=\"#ded5c7\" stroke-width=\"16\"><\/path><\/g><g fill=\"none\"><path d=\"M115 40C115 75 130 75 130 110M145 40C145 75 130 75 130 110M175 40C175 75 190 75 190 110M205 40C205 75 190 75 190 110M235 40C235 75 250 75 250 110M265 40C2 6\"><\/circle><circle cx=\"295\" cy=\"40\" r=\"6\"><\/circle><circle cx=\"325\" cy=\"40\" r=\"6\"><\/circle><\/g><\/svg><\/div><div class=\"f\" style=\"border-color:#7b7d55;margin-top:10px\"><input data-bind=\"dim.s\" maxlength=\"60\" placeholder=\"Título: 2 ou 3 palavras\" style=\"display:block;box-sizing:border-box;width:100%;border:none;background:transparent;color:#212020;font-family:'Open Sans',sans-serif;font-size:16px;line-height:24px;outline:none\"><\/div><div class=\"f\" style=\"border-color:#7b7d55;margin-top:10px\"><textarea data-bind=\"dimD.s\" placeholder=\"Descreva sua meta social\" style=\"display:block;box-sizing:border-box;width:100%;height:84px;border:none;background:transparent;color:#212020;font-family:'Open Sans',sans-serif;font-size:15px;line-height:22px;resize:none;outline:none\"><\/textarea><\/div><div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;background:#7b7d55;margin-right:10px;flex-shrink:0\"><\/span>Social Integrador<span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:6px 0 10px\"><div class=\"ik\">Processo integrador<\/div><p>Tudo o que conta na sua vida: outros seres, sua motivação, o que você entende e seu corpo.<\/p><div class=\"ik\">Como chegamos aqui<\/div><p>Pergunta 1: depende principalmente de outros seres? Sim.<\/p><div class=\"ik\">O que subtrai<\/div><p>Não subtrai nada. É o nível que mais depende de outros seres entre todos os seus processos.<\/p><div class=\"ik\">Foca mais em<\/div><p>os outros.<\/p><div class=\"ik\">Certeza e potencial<\/div><p>É o mais incerto e o de maior potencial de resultados.<\/p><div class=\"ik\">Exemplos<\/div><ul><li>Quero criar meus filhos com calma.<\/li><li>Quero contribuir com a minha comunidade.<\/li><li>Quero ter amizades honestas.<\/li><\/ul><p style=\"margin-top:10px;color:#4a4542\">Não é absoluto. É relativo a você e aos seus outros valores.<\/p><\/div><\/details> b4a2\" stroke-width=\"1.5\"><\/path>\n<circle class=\"nd up\" cx=\"24\" cy=\"73\" r=\"5.5\"><\/circle><circle class=\"nd up\" cx=\"24\" cy=\"213\" r=\"5.5\"><\/circle><circle class=\"nd up\" cx=\"24\" cy=\"353\" r=\"5.5\"><\/circle><circle class=\"nd\" cx=\"24\" cy=\"493\" r=\"5.5\"><\/circle>\n<path class=\"gh\" d=\"M10 345L22 341L38 345L40 359L28 366L12 362Z\" fill=\"none\" stroke=\"#4a4542\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"><\/path>\n<path class=\"ob\" d=\"M10 345L22 341L38 345L40 359L28 366L12 362Z\" fill=\"#8c4737\"><\/path>\n<\/svg><div class=\"bs\"><div class=\"bk\"><label class=\"lb\" for=\"ideal\">Ideal<\/label><textarea id=\"ideal\" data-bind=\"activity.ideal\" aria-label=\"Ação ideal\" placeholder=\"Qual é o melhor resultado que quero alcançar?\"><\/textarea><\/div><div class=\"bk\"><label class=\"lb\" for=\"sign\">Significativa<\/label><textarea id=\"sign\" data-bind=\"activity.sign\" aria-label=\"Ação significativa\" placeholder=\"Que pequena ação me permitirá avançar ou descobrir algo útil?\"><\/textarea><\/div><div class=\"bk\"><label class=\"lb lo\" for=\"obst\">Obstáculo<\/label><textarea id=\"obst\" data-bind=\"activity.obst\" aria-label=\"Obstáculo\" placeholder=\"O que poderia dificultar meu avanço, dentro ou fora de mim?\"><\/textarea><\/div><div class=\"bk\"><label class=\"lb\" for=\"resp\">PLANO<\/label><textarea id=\"resp\" data-bind=\"activity.plan\" aria-label=\"Resposta ao obstáculo\" placeholder=\"Se esse obstáculo aparecer, o que farei?\"><\/textarea><\/div><\/div><\/div>\n<div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"margin-right:10px;font-family:Open Sans,sans-serif;font-size:13px;color:#212020\">O que há debaixo do capô?<\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><div>Defina algo que você possa fazer, mesmo se o dia complicar.<br><div><p>Defina o que você gostaria de conseguir, sem confundir desejo com garantia.<br>Obstáculo<br>«Se eu me frustrar, reduzirei a tarefa a cinco minutos». Ou: «Se me faltar uma ferramenta, buscarei uma alternativa».<\/p><\/div><div><div><\/div><div><p><\/p><\/div><\/div><\/div><p class=\"tg\">#ciência do comportamento<\/p><\/div><\/details><\/div>\n", "13": "<h1 class=\"t\" style=\"margin:4px 0 2px\">Retorno<\/h1><p class=\"p\" style=\"margin:0 0 14px;font-family:Open Sans,sans-serif;font-size:14px;line-height:20px;color:#6e6762\">compara expectativa e realidade<\/p><div data-card=\"retro\"><\/div>\n\n<div data-rt-gen style=\"margin:6px 0 6px;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#8a6a45\">Investimento e retorno<\/div><p data-rt-q2 style=\"margin:0 0 8px;font:400 14px/1.45 var(--sans);color:#212020\">Quanta motivação você conseguiu investir e quanta satisfação obteve ao terminar?<\/p><div class=\"vrow\" data-vessels=\"retro\"><\/div>\n<div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"margin-right:10px;font-family:Open Sans,sans-serif;font-size:13px;color:#212020\">O que há debaixo do capô?<\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p style=\"margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #ded5c7;font-weight:600;font-size:14px;line-height:1.4;color:#212020\">Preencha cada recipiente: quanta motivação você investiu e quanta satisfação obteve. Se não tiver ações abertas, avalie um período em geral.<\/p><p>Nossa base de avaliação é a motivação e a satisfação. Às vezes estamos muito motivados sem estar muito satisfeitos. E às vezes estamos muito satisfeitos sem estar muito motivados.<\/p><p>Por exemplo, quero comprar o telefone novo X. Estou muito motivado, mas ao comprá-lo não me dá tanta satisfação quanto eu esperava.<\/p><p>Ou às vezes dou a um vizinho a resposta ácida que queria dar. Tinha pouca motivação para dá-la, mas fiquei muito satisfeito.<\/p><p>Por isso avaliaremos, como base, a motivação e a satisfação.&nbsp;<\/p>\n<p>Avalie assim que terminar. Com os dias, a memória suaviza o vivido.<\/p>\n<p>O recipiente mostra uma proporção, sem pedir números. Ajuda a sair do tudo ou nada, um viés descrito na terapia cognitiva (Beck, 1963). Que ele o reduza é uma hipótese.<\/p><p style=\"margin-top:8px\">Inspira-se em escalas testadas: as escalas visuais analógicas, usadas desde os anos 1920 (Scott, 1920; Hayes e Patterson, 1921), e a satisfação com a vida de 0 a 10 usada pelo WELLBY (Tesouro do Reino Unido, 2021). Seu recipiente mede uma ação, não sua vida. Essa validade não se transfere sozinha.<\/p><p style=\"margin-top:8px\">Avalie sem olhar sua previsão. Depois aparece a linha pontilhada dela, para comparar.<\/p><p class=\"tg\" style=\"color: #8a6a45\">#neurociência afetiva<\/p><\/div><\/details><\/div>\n", "14": "<h1 class=\"t\" style=\"margin:4px 0 10px\">Ação, previsão<\/h1><p class=\"p\" style=\"margin:0 0 14px;font-family:Open Sans,sans-serif;font-size:15px;line-height:23px;color:#212020\">Preencha cada recipiente conforme como você vai se sentir ao terminar a ação.<\/p><div data-card=\"pron\"><\/div>\n<div class=\"vrow\" data-vessels=\"pron\"><\/div>\n<div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"margin-right:10px;font-family:Open Sans,sans-serif;font-size:13px;color:#212020\">O que há debaixo do capô?<\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p>Aqui você não marca o que tem hoje. Você marca sua previsão: como prevê se sentir ao terminar sua ação. É um estado final, não uma mudança.<\/p><p>Nossa base de avaliação é a motivação e a satisfação. Às vezes estamos muito motivados sem estar muito satisfeitos. E às vezes estamos muito satisfeitos sem estar muito motivados.<\/p><p>Por exemplo, quero comprar o telefone novo X. Estou muito motivado, mas ao comprá-lo não me dá tanta satisfação quanto eu esperava.<\/p><p>Ou às vezes dou a um vizinho a resposta ácida que queria dar. Tinha pouca motivação para dá-la, mas fiquei muito satisfeito.<\/p><p>Por isso avaliaremos, como base, a motivação e a satisfação. Então, de todo o nosso mar de informação, em qual parte deveríamos investir?<\/p>\n<p>Sua previsão é um prognóstico. Esperar mais do que acontece é normal. Não é um defeito.<\/p>\n<p>O recipiente mostra uma proporção, sem pedir números. Ajuda a sair do tudo ou nada, um viés descrito na terapia cognitiva (Beck, 1963). Que ele o reduza é uma hipótese.<\/p><p style=\"margin-top:8px\">Inspira-se em escalas testadas: as escalas visuais analógicas, usadas desde os anos 1920 (Scott, 1920; Hayes e Patterson, 1921), e a satisfação com a vida de 0 a 10 usada pelo WELLBY (Tesouro do Reino Unido, 2021). Seu recipiente mede uma ação, não sua vida. Essa validade não se transfere sozinha.<\/p><p class=\"tg\" style=\"color: #8a6a45\">#neurociência afetiva<\/p><\/div><\/details><\/div>\n", "15": "<div style=\"margin: 12px 0 10px; font-size: 20px; color: #8a6a45; font-family: Open Sans, sans-serif\"><h1 class=\"t\" style=\"color: #212020; font-family: &quot;Cormorant Garamond&quot;, serif\">Qual é o foco da sua ação?<\/h1><p style=\"margin:0;font:400 13px/1.4 Open Sans,sans-serif;color:#6e6762\">Se obtém e oferece ao mesmo tempo, escolha a intenção principal.<\/p><\/div>\n\n\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n\n\n<\/div><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n\n<button class=\"o\" aria-pressed=\"false\" data-flow=\"c\"><span><svg viewBox=\"0 0 12 12\" width=\"13\" height=\"13\" aria-hidden=\"true\" style=\"flex:none;vertical-align:-1px;margin-right:7px\"><path d=\"M2 1.5L10.5 6L2 10.5Z\" fill=\"#212020\" stroke=\"#212020\" stroke-width=\"1\" stroke-linejoin=\"round\"/><\/svg>Visão · conquistar<\/span><small class=\"kw\" data-kw=\"flow.in\" hidden><\/small><\/button>\n<button class=\"o\" aria-pressed=\"false\" data-flow=\"o\"><span><svg viewBox=\"0 0 12 12\" width=\"13\" height=\"13\" aria-hidden=\"true\" style=\"fl "Cormorant Garamond,serif\">Social<\/text><\/g><g class=\"tl3\"><text x=\"16\" y=\"100\" font-size=\"11\" fill=\"#6e6762\" font-family=\"Open Sans,sans-serif\">Ponderador<\/text><text x=\"16\" y=\"116\" font-size=\"17\" font-weight=\"500\" fill=\"#212020\" font-family=\"Cormorant Garamond,serif\">Emocional<\/text><\/g><g class=\"tl2\"><text x=\"16\" y=\"170\" font-size=\"11\" fill=\"#6e6762\" font-family=\"Open Sans,sans-serif\">Prognosticador<\/text><text x=\"16\" y=\"186\" font-size=\"17\" font-weight=\"500\" fill=\"#212020\" font-family=\"Cormorant Garamond,serif\">Racional<\/text><\/g><g class=\"tl1\"><text x=\"16\" y=\"240\" font-size=\"11\" fill=\"#6e6762\" font-family=\"Open Sans,sans-serif\">Reacionador<\/text><text x=\"16\" y=\"256\" font-size=\"17\" font-weight=\"500\" fill=\"#212020\" font-family=\"Cormorant Garamond,serif\">Corporal<\/text><\/g><\/svg><div class=\"qz\"><p class=\"qq\" data-qq aria-live=\"polite\"><\/p><div class=\"qb\"><button type=\"button\" class=\"o\" data-qa=\"n\">Não<\/button><button type=\"button\" class=\"o\" data-qa=\"y\">Sim<\/button><\/div><button type=\"button\" class=\"qr\" data-qr hidden>Reiniciar<\/button><\/div>\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n\n\n<\/div>\n\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n\n<button class=\"o\" aria-pressed=\"false\" style=\"min-height: 64px; font-family: Open Sans, sans-serif; border-color: #7b7d55\" data-dim=\"s\"><span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#7b7d55;margin-right:8px\"><\/span>Social<\/button>\n<button class=\"o\" aria-pressed=\"false\" style=\"min-height: 64px; font-family: Open Sans, sans-serif; border-color: #efd49f\" data-dim=\"e\"><span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#efd49f;margin-right:8px\"><\/span>Emocional<\/button><button class=\"o\" aria-pressed=\"false\" style=\"min-height: 64px; font-family: Open Sans, sans-serif; font-size: 18px; border-color: #bf9268\" data-dim=\"r\"><span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#bf9268;margin-right:8px\"><\/span>Racional<br><\/button><button class=\"o\" aria-pressed=\"false\" style=\"min-height: 64px; font-family: Open Sans, sans-serif; border-color: #8c4737\" data-dim=\"c\"><span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;background:#8c4737;margin-right:8px\"><\/span>Corporal<\/button><\/div><div style=\"display:flex;flex-direction:column;gap:10px\">\n\n\n<\/div>\n<div style=\"margin-top:auto;padding-top:14px\"><details class=\"inf\"><summary><span style=\"margin-right:10px;font-family:Open Sans,sans-serif;font-size:13px;color:#212020\">O que há debaixo do capô?<\/span><span class=\"ii\">i<\/span><\/summary><div class=\"ip\" style=\"margin:10px 0\"><p>Escolha o nível do qual seu resultado depende principalmente. Responda em ordem:<\/p><ol style=\"margin-top:8px\"><li>Depende principalmente de outros seres? → Integrador · Social.<\/li><li>Se não: depende sobretudo de como você valoriza ou sente? → Ponderador · Emocional.<\/li><li>Se não: depende sobretudo de informação ou de entender? → Prognosticador · Racional.<\/li><li>Se não → Reacionador · Corporal.<\/li><\/ol><p>Todos os níveis intervêm. Escolha o que mais pesa no resultado. É uma convenção, não uma lei.<\/p><p class=\"tg\" style=\"margin-top:8px\">#sistemas de informação<\/p><\/div><\/details><\/div>\n", "25": "<div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px\"><p style=\"margin:0;font-size:18px;line-height:25px;color:#4a4542;text-align:center;max-width:290px;font-family:Open Sans,sans-serif;font-weight:600\">Na realidade temos incontáveis expectativas e formas de realizá-las.<\/p><svg viewBox=\"0 0 342 300\" width=\"342\" height=\"300\" role=\"img\" aria-label=\"A água entra pela direita e se divide em ramos curtos, sempre com o mesmo ângulo, até preencher todo um re function bayes(a,k){
  if(!a.touchedPron||!a.dim) return null;
  var past=S.records.filter(function(r){return r.kind!=='per'&&r.id!==a.id&&r.obt&&r.dim===a.dim&&(!a.flow||!r.flow||r.flow===a.flow);});
  var sig=15, tau=a.conf==null?20:(30-0.2*a.conf), b=a.pron[k];
  var n=past.length, sum=past.reduce(function(t,r){return t+r.obt[k];},0);
  var v=1/(1/(tau*tau)+n/(sig*sig)), m=v*(b/(tau*tau)+sum/(sig*sig));
  return {m:Math.round(clamp(m,0,100)),sd:Math.round(Math.sqrt(v)),n:n};
}

}

app.addEventListener('keydown',function(e){var el=e.target.closest&&e.target.closest('[data-edit]');if(el&&e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();EV.edit=el.getAttribute('data-edit');render();}});
app.addEventListener('focusin',function(e){
  var t=e.target; if(t.tagName==='TEXTAREA'||t.tagName==='INPUT') setTimeout(function(){try{t.scrollIntoView({block:'center',behavior:'smooth'});}catch(x){}},320);
});
/* modo presentación en escritorio: escala el contenido para llenar la altura */
function fit(){
  var gp=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'))||0, d=innerWidth>=900&&innerHeight>=560, z=d?Math.max(1,Math.min(1.7,(innerHeight-gp)/760)):1;
  app.style.setProperty('--z',z.toFixed(3));
  var vv=window.visualViewport?visualViewport.height:innerHeight; if(innerWidth<560) app.style.setProperty('--vh',Math.round(vv)+'px'); else app.style.removeProperty('--vh');
}
fit(); window.addEventListener('resize',fit); if(window.visualViewport) visualViewport.addEventListener('resize',fit);
setTimeout(function(){checkUpdate(false);},3000);
document.addEventListener('visibilitychange',function(){if(!document.hidden) checkUpdate(false);});
setInterval(function(){if(!document.hidden) checkUpdate(false);},1800000);
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',function(){
    var vv=window.visualViewport;
    if(vv.height<window.innerHeight-120){app.style.height=vv.height+'px';app.style.maxHeight='none';} else {app.style.height='';app.style.maxHeight='';}
  });
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.ix')) $$('details.ix[open]').forEach(function(d){d.open=false;});
});

/* deslizar a los lados y flechas del teclado */
(function(){
  var x0=0,y0=0,ok=false;
  var skip=function(t){return t.closest&&t.closest('.vsvg,textarea,input,.mn,.pager,svg[role=slider]');};
  app.addEventListener('touchstart',function(e){var t=e.touches[0];x0=t.clientX;y0=t.clientY;ok=e.touches.length===1&&!skip(e.target);},{passive:true});
  app.addEventListener('touchend',function(e){
    if(!ok||cur===18||cur===19) return; ok=false;
    var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){ if(dx<0) step(1,LAST-1); else if(dx>0) step(-1,LAST-1); }
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(cur===18||cur===19||e.altKey||e.ctrlKey||e.metaKey) return;
    var t=e.target; if(t&&(/^(TEXTAREA|INPUT|SELECT)$/.test(t.tagName)||t.getAttribute&&t.getAttribute('role')==='slider')) return;
    if(e.key==='ArrowRight'){step(1,LAST-1);} else if(e.key==='ArrowLeft'){step(-1,LAST-1);}
  });
})();
(function(){var mapped=!!(S.flow.in||S.flow.out||S.records.length||DIMS.some(function(d){return S.dim[d[0]];})); if(mapped) cur=27;})();
render();
})();
